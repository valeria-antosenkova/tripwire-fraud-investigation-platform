name: Build and Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 -t tripwire .
          docker tag tripwire:latest 210039345357.dkr.ecr.us-east-2.amazonaws.com/tripwire:latest
          docker push 210039345357.dkr.ecr.us-east-2.amazonaws.com/tripwire:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster tripwire-cluster-tf \
            --service tripwire-service-tf \
            --force-new-deployment \
            --region us-east-2