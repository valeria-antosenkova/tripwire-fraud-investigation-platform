<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tripwire Login</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #18202a;
            background: #f4f7fb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top left, rgba(20, 87, 121, 0.12), transparent 34%),
                radial-gradient(circle at bottom right, rgba(203, 88, 60, 0.12), transparent 30%),
                #f4f7fb;
        }

        .card {
            width: min(440px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #d5dde7;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 18px 50px rgba(42, 52, 65, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        p {
            margin: 0 0 24px;
            color: #52606d;
            line-height: 1.5;
        }

        label {
            display: grid;
            gap: 6px;
            margin-bottom: 16px;
            color: #52606d;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        input {
            min-height: 46px;
            border: 1px solid #b8c3cf;
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
            color: #18202a;
            background: #fff;
        }

        button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 8px;
            background: #155f7d;
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .error {
            display: none;
            margin-top: 16px;
            border: 1px solid #e1ad9f;
            border-radius: 8px;
            padding: 10px 12px;
            background: #fff4f1;
            color: #8c2c1d;
            font-weight: 700;
        }

        .hint {
            margin-top: 16px;
            color: #52606d;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>Agent Login</h1>
    <p>Enter your agent email and password to access Tripwire.</p>

    <form id="loginForm">
        <label>
            Email
            <input id="email" type="email" autocomplete="username" required>
        </label>

        <label>
            Password
            <input id="password" type="password" autocomplete="current-password" required>
        </label>

        <button id="loginButton" type="submit">Login</button>
        <div id="error" class="error"></div>
    </form>

    <div class="hint">Successful login will take you to the dashboard at <strong>index.html</strong>.</div>
</main>

<script>
    const form = document.querySelector("#loginForm");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const loginButton = document.querySelector("#loginButton");
    const error = document.querySelector("#error");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setLoading(true);
        clearError();

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email.value.trim(),
                    password: password.value
                })
            });

            const text = await response.text();
            const data = text ? JSON.parse(text) : {};

            if (!response.ok) {
                throw new Error(data.message || "Login failed");
            }

            window.location.href = "/index.html";
        } catch (err) {
            showError(err.message);
        } finally {
            setLoading(false);
        }
    });

    function setLoading(isLoading) {
        loginButton.disabled = isLoading;
        loginButton.textContent = isLoading ? "Logging in..." : "Login";
    }

    function showError(message) {
        error.textContent = message;
        error.style.display = "block";
    }

    function clearError() {
        error.textContent = "";
        error.style.display = "none";
    }
</script>
</body>
</html>
