<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tripwire Fraud Review</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #18202a;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(20, 87, 121, 0.10), transparent 34%),
                linear-gradient(315deg, rgba(203, 88, 60, 0.12), transparent 32%),
                #f4f7fb;
        }

        main {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 0.95;
            letter-spacing: 0;
        }

        .subtitle {
            max-width: 520px;
            margin: 10px 0 0;
            color: #52606d;
            line-height: 1.5;
        }

        .status-pill {
            min-width: 152px;
            padding: 10px 14px;
            border: 1px solid #d5dde7;
            border-radius: 999px;
            background: #ffffff;
            color: #52606d;
            text-align: center;
            font-weight: 700;
        }

        .panel {
            border: 1px solid #d5dde7;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 18px 50px rgba(42, 52, 65, 0.10);
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(160px, 1fr) auto auto;
            gap: 12px;
            padding: 18px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
            color: #52606d;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #b8c3cf;
            border-radius: 6px;
            padding: 9px 11px;
            background: #fff;
            color: #18202a;
            font: inherit;
        }

        button {
            min-height: 44px;
            border: 0;
            border-radius: 6px;
            padding: 0 16px;
            background: #155f7d;
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button.secondary {
            border: 1px solid #b8c3cf;
            background: #fff;
            color: #18202a;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.66;
        }

        .content {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 1px;
            border-top: 1px solid #d5dde7;
            background: #d5dde7;
        }

        .score-card,
        .details {
            background: #fff;
            padding: 22px;
        }

        .score {
            display: grid;
            place-items: center;
            width: 180px;
            height: 180px;
            margin: 0 auto 18px;
            border: 14px solid #d5dde7;
            border-radius: 50%;
            color: #18202a;
            font-size: 3rem;
            font-weight: 900;
        }

        .score.high {
            border-color: #be3d2a;
        }

        .score.medium {
            border-color: #bf7f16;
        }

        .score.low {
            border-color: #23845d;
        }

        .decision {
            margin: 0;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 900;
        }

        .meta {
            margin: 8px 0 0;
            color: #52606d;
            text-align: center;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 1rem;
        }

        ul {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            border: 1px solid #e0e6ee;
            border-radius: 6px;
            padding: 10px 12px;
            background: #f8fafc;
        }

        pre {
            overflow: auto;
            max-height: 260px;
            margin: 18px 0 0;
            border: 1px solid #e0e6ee;
            border-radius: 6px;
            padding: 12px;
            background: #111820;
            color: #e9eef6;
            font-size: 0.82rem;
        }

        .error {
            display: none;
            margin: 14px 18px 0;
            border: 1px solid #e1ad9f;
            border-radius: 6px;
            padding: 10px 12px;
            background: #fff4f1;
            color: #8c2c1d;
            font-weight: 700;
        }

        @media (max-width: 760px) {
            header,
            .controls,
            .content {
                grid-template-columns: 1fr;
            }

            header {
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Tripwire Fraud Review</h1>
            <p class="subtitle">Score seeded transactions against the Dymo/TPE verification API and inspect the decision signals.</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <a href="/dashboard.html" style="min-height:38px;display:inline-flex;align-items:center;padding:0 16px;border:1px solid #d5dde7;border-radius:6px;background:#fff;color:#18202a;font-family:inherit;font-weight:700;font-size:0.88rem;text-decoration:none;">⟵ Dashboard</a>
            <div id="apiStatus" class="status-pill">Ready</div>
        </div>
    </header>

    <section class="panel">
        <form id="scoreForm" class="controls">
            <label>
                Transaction ID
                <input id="transactionId" type="number" min="1" value="1" required>
            </label>
            <button id="scoreButton" type="submit">Score Transaction</button>
            <button id="loadButton" class="secondary" type="button">Load Transaction</button>
        </form>
        <div id="error" class="error"></div>

        <div class="content">
            <section class="score-card">
                <div id="score" class="score">--</div>
                <p id="decision" class="decision">Not scored</p>
                <p id="meta" class="meta">Choose a transaction and run scoring.</p>
            </section>

            <section class="details">
                <h2>Signals</h2>
                <ul id="signals">
                    <li>No signals yet.</li>
                </ul>
                <pre id="rawOutput">{}</pre>
            </section>
        </div>
    </section>
</main>

<script>
    const form = document.querySelector("#scoreForm");
    const transactionId = document.querySelector("#transactionId");
    const scoreButton = document.querySelector("#scoreButton");
    const loadButton = document.querySelector("#loadButton");
    const apiStatus = document.querySelector("#apiStatus");
    const error = document.querySelector("#error");
    const score = document.querySelector("#score");
    const decision = document.querySelector("#decision");
    const meta = document.querySelector("#meta");
    const signals = document.querySelector("#signals");
    const rawOutput = document.querySelector("#rawOutput");

    const params = new URLSearchParams(window.location.search);
    if (params.has("id")) {
        transactionId.value = params.get("id");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        await scoreTransaction();
    });

    loadButton.addEventListener("click", async () => {
        await loadTransaction();
    });

    async function scoreTransaction() {
        setLoading(true, "Scoring");
        clearError();

        try {
            const result = await request(`/transaction/${transactionId.value}/score`, { method: "POST" });
            renderScore(result);
        } catch (err) {
            showError(err.message);
        } finally {
            setLoading(false, "Ready");
        }
    }

    async function loadTransaction() {
        setLoading(true, "Loading");
        clearError();

        try {
            const result = await request(`/transaction/${transactionId.value}`);
            renderTransaction(result);
        } catch (err) {
            showError(err.message);
        } finally {
            setLoading(false, "Ready");
        }
    }

    async function request(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();
        const data = text ? JSON.parse(text) : {};

        if (!response.ok) {
            throw new Error(data.message || `Request failed with ${response.status}`);
        }

        return data;
    }

    function renderScore(result) {
        const value = Math.round(result.score ?? 0);
        const status = value >= 80 ? "DENIED" : value >= 50 ? "UNDER REVIEW" : "APPROVED";

        score.textContent = value;
        score.className = `score ${value >= 80 ? "high" : value >= 50 ? "medium" : "low"}`;
        decision.textContent = status;
        meta.textContent = result.apiAvailable ? "Dymo API response included" : "Local fallback scoring";
        renderSignals(result.signals || []);
        rawOutput.textContent = JSON.stringify(result, null, 2);
    }

    function renderTransaction(result) {
        const value = Math.round(result.riskScore ?? 0);
        score.textContent = value;
        score.className = `score ${value >= 80 ? "high" : value >= 50 ? "medium" : "low"}`;
        decision.textContent = result.status || "UNASSIGNED";
        meta.textContent = `Transaction ${result.id}, account ${result.accountId}`;
        renderSignals(["Loaded saved transaction data. Run scoring to see Dymo signals."]);
        rawOutput.textContent = JSON.stringify(result, null, 2);
    }

    function renderSignals(items) {
        signals.innerHTML = "";

        if (!items.length) {
            signals.innerHTML = "<li>No signals returned.</li>";
            return;
        }

        for (const item of items) {
            const li = document.createElement("li");
            li.textContent = item;
            signals.appendChild(li);
        }
    }

    function setLoading(isLoading, label) {
        scoreButton.disabled = isLoading;
        loadButton.disabled = isLoading;
        apiStatus.textContent = label;
    }

    function showError(message) {
        error.textContent = message;
        error.style.display = "block";
    }

    function clearError() {
        error.textContent = "";
        error.style.display = "none";
    }
</script>
</body>
</html>
